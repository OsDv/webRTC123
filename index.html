<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link href="style.css" rel="stylesheet">
</head>

<body>
  <div class="container">
    <button id="start-connection-button">start connection</button>
    <div class="input-container">
      <input type="text" id="message-input" name="message-input" placeholder="enter message...">
      <button type="button" id="send-btn">send</button>
    </div>
    <textarea id="message-textarea" readonly disabled></textarea>


    <div>
      <div class="input-container">
        <textarea id="offer-area"></textarea>
        <button id="create-offer">create offer</button>
        <button id="receive-offer">reseive offer</button>
      </div>
      <div class="input-container">
        <textarea id="response-area"></textarea>
        <button id="create-response">create response</button>
        <button id="receive-response">receive response</button>
      </div>
      <div class="input-container">
        <textarea id="ice-area"></textarea>
        <button id="add-ice">add ICE</button>
      </div>
    </div>
  </div>

  <script src="mqtt.min.js"></script>
  <script src="script.js"></script>

</body>

</html>
