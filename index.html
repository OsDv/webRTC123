<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link href="style.css" rel="stylesheet">
</head>

<body>
  <div class="container">
    <div id="login-screen" class="screen active">
      <input type="text" name="username" id="username-input" placeholder="username here...">
      <input type="password" name="password" id="password-input" placeholder="password here...">
      <button id="login-btn">login</button>
    </div>
    <div id="messaging-screen" class="screen">
      <div class="input-container">
        <input type="text" id="peer-username" placeholder="peer username...">
        <button id="connection-button">start connection</button>
      </div>

      <textarea id="message-textarea" readonly disabled></textarea>
      <div class="input-container">
        <input type="text" id="message-input" name="message-input" placeholder="enter message...">
        <button type="button" id="send-btn">send</button>
      </div>
      <div class="input-container">
        <button type="button" id="michrophone-btn"><img src="icons/mic-on.svg" id="mic-icon"></button>
        <audio id="remote-audio" autoplay></audio>
      </div>
    </div>


    <script src="mqtt.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
